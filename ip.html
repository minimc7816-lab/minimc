<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MC - Server IP</title>

<style>
body {
    margin: 0;
    background: url('https://cdn.discordapp.com/attachments/1502245812669911123/1508812167615348858/InShot_20260526_180708071.gif?ex=6a1a3215&is=6a18e095&hm=d4f05629cb9cb7b670d62cc50146926157193a37ccf8d970b077d56958231cfc&') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    color: white;
    padding: 20px;
    overflow-x: hidden;
}

.menu-icon {
    position: fixed;
    top: 20px;
    left: 20px;
    cursor: pointer;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 20px;
    padding: 5px;
}

.menu-icon span {
    display: block;
    height: 3px;
    width: 100%;
    background-color: white;
    border-radius: 2px;
    box-shadow: 0 0 8px orange;
    transition: 0.3s;
}

.menu-icon:hover span {
    background-color: orange;
    box-shadow: 0 0 12px red;
}

.sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 2000;
    top: 0;
    left: 0;
    background-color: rgba(15, 15, 15, 0.95);
    backdrop-filter: blur(10px);
    border-right: 2px solid orange;
    overflow-x: hidden;
    transition: 0.4s ease;
    box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7);
}

/* SIDEBAR HEADER FOR IP PAGE */
.sidebar-header {
    display: flex;
    align-items: center;
    padding: 20px 15px;
    border-bottom: 1px solid rgba(255, 165, 0, 0.2);
    gap: 10px;
}

.sidebar-logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    box-shadow: 0 0 10px orange;
}

.sidebar-title {
    font-size: 22px;
    font-weight: bold;
    flex-grow: 1;
    animation: sidebarRgb 6s infinite linear;
    white-space: nowrap;
}

.sidebar .close-btn {
    font-size: 30px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    line-height: 1;
}

.sidebar .close-btn:hover {
    color: red;
}

.sidebar a.menu-link {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 20px;
    color: #ccc;
    display: block;
    transition: 0.3s;
    font-weight: bold;
    border-bottom: 1px solid rgba(255, 165, 0, 0.1);
    text-align: left;
}

.sidebar a.menu-link:hover {
    color: orange;
    padding-left: 40px;
    background: rgba(255, 165, 0, 0.05);
    text-shadow: 0 0 10px orange;
}

.ip-container {
    max-width: 600px;
    margin: 80px auto;
    background: rgba(0, 0, 0, 0.8);
    backdrop-filter: blur(8px);
    padding: 40px 20px;
    border-radius: 20px;
    box-shadow: 0 0 30px orange;
    border: 1px solid rgba(255, 165, 0, 0.3);
    text-align: center;
    box-sizing: border-box;
}

.ip-title {
    font-size: 50px;
    font-weight: bold;
    margin-bottom: 40px;
    animation: rgbGlow 6s infinite linear;
}

.info-box {
    background: rgba(255, 255, 255, 0.05);
    padding: 15px 20px;
    margin: 20px 0;
    border-radius: 12px;
    border-left: 5px solid orange;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    box-sizing: border-box;
    gap: 15px;
    flex-wrap: wrap;
}

.text-wrapper {
    text-align: left;
    flex: 1;
    min-width: 200px;
    word-break: break-all;
}

.info-text {
    font-size: 20px;
    font-weight: bold;
    display: block;
    animation: rgbGlow 8s infinite linear;
}

.info-label {
    font-size: 13px;
    color: #aaa;
    display: block;
    margin-bottom: 5px;
}

.copy-btn {
    background: orange;
    color: black;
    border: none;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 0 10px orange;
    white-space: nowrap;
}

.copy-btn:hover {
    background: red;
    color: white;
    box-shadow: 0 0 15px red;
}

.copy-btn.copied {
    background: #2ecc71 !important;
    color: white !important;
    box-shadow: 0 0 15px #2ecc71 !important;
}

.back-btn {
    display: inline-block;
    margin-bottom: 30px;
    padding: 10px 20px;
    background: orange;
    color: black;
    text-decoration: none;
    font-weight: bold;
    border-radius: 8px;
    box-shadow: 0 0 15px orange;
    transition: 0.3s;
}

.back-btn:hover {
    background: red;
    color: white;
    box-shadow: 0 0 15px red;
}

@keyframes rgbGlow {
    0% { color: #ff3333; text-shadow: 0 0 10px #ff3333; border-color: #ff3333; }
    20% { color: #ff9933; text-shadow: 0 0 10px #ff9933; border-color: #ff9933; }
    40% { color: #33ff33; text-shadow: 0 0 10px #33ff33; border-color: #33ff33; }
    60% { color: #33ffff; text-shadow: 0 0 10px #33ffff; border-color: #33ffff; }
    80% { color: #3333ff; text-shadow: 0 0 10px #3333ff; border-color: #3333ff; }
    100% { color: #ff33ff; text-shadow: 0 0 10px #ff33ff; border-color: #ff33ff; }
}

@keyframes sidebarRgb {
    0% { color: #ff3333; text-shadow: 0 0 8px #ff3333; }
    20% { color: #ff9933; text-shadow: 0 0 8px #ff9933; }
    40% { color: #33ff33; text-shadow: 0 0 8px #33ff33; }
    60% { color: #33ffff; text-shadow: 0 0 8px #33ffff; }
    80% { color: #3333ff; text-shadow: 0 0 8px #3333ff; }
    100% { color: #ff33ff; text-shadow: 0 0 8px #ff33ff; }
}

@media (max-width: 480px) {
    .info-box {
        flex-direction: column;
        align-items: flex-start;
    }
    .copy-btn {
        width: 100%;
        text-align: center;
        margin-top: 5px;
    }
    .info-text {
        font-size: 17px;
    }
}
</style>
</head>
<body>

<div class="menu-icon" onclick="openNav()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="mySidebar" class="sidebar">
    <div class="sidebar-header">
        <img src="https://cdn.discordapp.com/attachments/1502245812669911123/1508797553045409822/file_0000000073e072088f5c6643f042e8b8.png?ex=6a1a2478&is=6a18d2f8&hm=6147184842b06d3ec5e85c5eab7aea372e9dd6174c5da08725ff4b71ec0d933e&" class="sidebar-logo">
        <div class="sidebar-title">MINI MC</div>
        <span class="close-btn" onclick="closeNav()">&times;</span>
    </div>
    <a href="index.html" class="menu-link">Home</a>
    <a href="ip.html" class="menu-link">Server IP</a>
    <a href="https://discord.gg/M9KGMpu7zQ" target="_blank" class="menu-link">Discord</a>
    <a href="#" class="menu-link">Store</a>
    <a href="rules.html" class="menu-link">Rules</a>
</div>

<div class="ip-container">
    <a href="index.html" class="back-btn">← Back to Home</a>
    <div class="ip-title">SERVER INFO</div>

    <div class="info-box">
        <div class="text-wrapper">
            <span class="info-label">SERVER IP / ADDRESS</span>
            <span class="info-text" id="ipText">play.minimc.nethercore.in</span>
        </div>
        <button class="copy-btn" onclick="copyToClipboard('ipText', this)">Copy IP</button>
    </div>

    <div class="info-box">
        <div class="text-wrapper">
            <span class="info-label">PORT</span>
            <span class="info-text" id="portText">19132</span>
        </div>
        <button class="copy-btn" onclick="copyToClipboard('portText', this)">Copy Port</button>
    </div>
</div>

<script>
function openNav() {
    document.getElementById("mySidebar").style.width = "260px";
}

function closeNav() {
    document.getElementById("mySidebar").style.width = "0";
}

function copyToClipboard(elementId, button) {
    var textToCopy = document.getElementById(elementId).innerText;
    navigator.clipboard.writeText(textToCopy).then(function() {
        var originalText = button.innerText;
        button.innerText = "Copied!";
        button.classList.add("copied");
        setTimeout(function() {
            button.innerText = originalText;
            button.classList.remove("copied");
        }, 2000);
    }).catch(function(err) {
        console.error("Unable to copy text: ", err);
    });
}
</script>

</body>
</html>
