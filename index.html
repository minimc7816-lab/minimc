<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini MC</title>
    <meta name="description" content="Join Mini MC - The ultimate Minecraft Bedrock server! Get Server IP, Port, Rules, and Store details here.">
    <meta name="keywords" content="Mini MC, minimc, best minecraft server, MiniMC, World Top 10 server, NetherCore, Best Hosting, play.minimc.nethercore.in, minimc7816-lab, Mini MC Server, Minecraft Bedrock India, Mini MC Store">
    <meta name="author" content="Mini MC Team">
    

<style>
body {
    margin: 0;
    background: url('https://cdn.discordapp.com/attachments/1502245812669911123/1508812167615348858/InShot_20260526_180708071.gif?ex=6a1a3215&is=6a18e095&hm=d4f05629cb9cb7b670d62cc50146926157193a37ccf8d970b077d56958231cfc&') no-repeat center center fixed;
    background-size: cover;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    overflow-x: hidden;
}

/* HAMBURGER MENU ICON */
.menu-icon {
    position: fixed;
    top: 20px;
    left: 20px;
    cursor: pointer;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 30px;
    height: 20px;
    padding: 5px;
}

.menu-icon span {
    display: block;
    height: 3px;
    width: 100%;
    background-color: white;
    border-radius: 2px;
    box-shadow: 0 0 8px orange;
    transition: 0.3s;
}

.menu-icon:hover span {
    background-color: orange;
    box-shadow: 0 0 12px red;
}

/* SIDE NAVIGATION BAR */
.sidebar {
    height: 100%;
    width: 0;
    position: fixed;
    z-index: 2000;
    top: 0;
    left: 0;
    background-color: rgba(15, 15, 15, 0.95);
    backdrop-filter: blur(10px);
    border-right: 2px solid orange;
    overflow-x: hidden;
    transition: 0.4s ease;
    box-shadow: 5px 0 25px rgba(0, 0, 0, 0.7);
}

/* SIDEBAR HEADER (LOGO + RGB TEXT + CLOSE BTN) */
.sidebar-header {
    display: flex;
    align-items: center;
    padding: 20px 15px;
    border-bottom: 1px solid rgba(255, 165, 0, 0.2);
    gap: 10px;
}

.sidebar-logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    box-shadow: 0 0 10px orange;
}

.sidebar-title {
    font-size: 22px;
    font-weight: bold;
    flex-grow: 1;
    animation: sidebarRgb 6s infinite linear;
    white-space: nowrap;
}

.sidebar .close-btn {
    font-size: 30px;
    color: white;
    cursor: pointer;
    transition: 0.3s;
    line-height: 1;
}

.sidebar .close-btn:hover {
    color: red;
}

/* Menu Links */
.sidebar a.menu-link {
    padding: 15px 30px;
    text-decoration: none;
    font-size: 20px;
    color: #ccc;
    display: block;
    transition: 0.3s;
    font-weight: bold;
    border-bottom: 1px solid rgba(255, 165, 0, 0.1);
    text-align: left;
}

.sidebar a.menu-link:hover {
    color: orange;
    padding-left: 40px;
    background: rgba(255, 165, 0, 0.05);
    text-shadow: 0 0 10px orange;
}

/* IMAGE */
.logo img {
    width: 180px;
    margin-top: 40px;
    border-radius: 20px;
    box-shadow: 0 0 25px orange;
}

/* GLOW TEXT */
.glow-text {
    font-size: 60px;
    font-weight: bold;
    margin-top: 15px;
    text-shadow: 0 0 10px orange, 0 0 20px red;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px orange; }
    to { text-shadow: 0 0 40px red; }
}

/* BUTTON */
.btn {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
    text-decoration: none;
    display: inline-block;
}

.server-btn {
    background: orange;
    color: black;
    box-shadow: 0 0 15px orange;
}

.server-btn:hover {
    background: red;
    color: white;
}

.discord-btn {
    background: #5865F2;
    color: white;
    box-shadow: 0 0 15px #5865F2;
}

.discord-btn:hover {
    background: #404EED;
}

/* RGB ANIMATION FOR SIDEBAR TITLE */
@keyframes sidebarRgb {
    0% { color: #ff3333; text-shadow: 0 0 8px #ff3333; }
    20% { color: #ff9933; text-shadow: 0 0 8px #ff9933; }
    40% { color: #33ff33; text-shadow: 0 0 8px #33ff33; }
    60% { color: #33ffff; text-shadow: 0 0 8px #33ffff; }
    80% { color: #3333ff; text-shadow: 0 0 8px #3333ff; }
    100% { color: #ff33ff; text-shadow: 0 0 8px #ff33ff; }
}
</style>
</head>

<body>

<div class="menu-icon" onclick="openNav()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="mySidebar" class="sidebar">
    <div class="sidebar-header">
        <img src="https://cdn.discordapp.com/attachments/1502245812669911123/1508797553045409822/file_0000000073e072088f5c6643f042e8b8.png?ex=6a1a2478&is=6a18d2f8&hm=6147184842b06d3ec5e85c5eab7aea372e9dd6174c5da08725ff4b71ec0d933e&" class="sidebar-logo">
        <div class="sidebar-title">MINI MC</div>
        <span class="close-btn" onclick="closeNav()">&times;</span>
    </div>
    <a href="index.html" class="menu-link">Home</a>
    <a href="ip.html" class="menu-link">Server IP</a>
    <a href="https://discord.gg/M9KGMpu7zQ" target="_blank" class="menu-link">Discord</a>
    <a href="#" class="menu-link">Store</a>
    <a href="rules.html" class="menu-link">Rules</a>
</div>

<div class="logo">
    <img src="https://cdn.discordapp.com/attachments/1502245812669911123/1508797553045409822/file_0000000073e072088f5c6643f042e8b8.png?ex=6a1a2478&is=6a18d2f8&hm=6147184842b06d3ec5e85c5eab7aea372e9dd6174c5da08725ff4b71ec0d933e&" width="200">
</div>

<div class="glow-text">𝕄𝕀ℕ𝕀 𝕄ℂ </div>

<br>
<a href="ip.html" class="btn server-btn">Server IP</a>

<br>
<button class="btn discord-btn" onclick="joinDiscord()">
    Join Discord
</button>

<audio id="bg-music" loop>
    <source src="http://googleusercontent.com/file_content/0" type="audio/mp3">
</audio>

<script>
document.addEventListener('click', function() {
    var audio = document.getElementById('bg-music');
    if (audio.paused) {
        audio.play().catch(function(error) {
            console.log("Audio play failed:", error);
        });
    }
}, { once: true }); 

function joinDiscord() {
    window.open("https://discord.gg/M9KGMpu7zQ", "_blank");
}

function openNav() {
    document.getElementById("mySidebar").style.width = "260px";
}

function closeNav() {
    document.getElementById("mySidebar").style.width = "0";
}
</script>

</body>
</html>
